name: Check

on:
  workflow_dispatch:  # can be triggered manually
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-matrix:
    name: Eval matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
      - name: Generate Nix Matrix
        id: set-matrix
        run: |
          set -Eeu
          matrix="$(nix eval --json .#githubActions.matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  flake-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
      - name: Run flake checker
        uses: DeterminateSystems/flake-checker-action@main

  build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: build-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          # Options: holster, carve, cleave (default), rampage
          hatchet-protocol: rampage
          # Increase root-safe-haven to 25GB so that build-dir has enough space
          root-safe-haven: '25600' # Default 2048
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
      - name: Setup nix cache
        uses: cachix/cachix-action@v17
        with:
          name: matt-sturgeon
          extraPullNames: nix-community
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Build ${{ matrix.attr }}
        env:
          attr: ${{ matrix.attr }}
        run: |
          nix build ".#$attr" \
              --abort-on-warn \
              --print-build-logs \
              --log-format raw

  # This meta-job exists only as a target for the 'required status checks' ruleset.
  # It 'needs' all jobs that block merging a PR. Update the 'needs' list as CI requirements evolve.
  check-success:
    # Important: do not rename this job!
    # The job name is the unique identifier used by required status checks.
    name: Success
    runs-on: ubuntu-slim
    if: always()
    permissions: {}

    needs:
      - build
      - flake-checker

    steps:
      - name: Check results
        shell: python
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          import json, os, sys

          ok = all(
            result == "success"
            for result in json.loads(os.environ["RESULTS"])
          )

          sys.exit(not ok)
